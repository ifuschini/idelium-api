name: idelium-laravel-capture

services:
  db:
    image: mariadb:10.6.22@sha256:7589b386fa6686a5d5f131b504ed21c81e492c48b78c6c4be0d5be1066542559
    environment:
      MYSQL_DATABASE: ${CAPTURE_DB_NAME:-idelium_capture}
      MYSQL_USER: ${CAPTURE_DB_USER:-idelium_capture}
      MYSQL_PASSWORD: ${CAPTURE_DB_PASSWORD:?CAPTURE_DB_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${CAPTURE_DB_ROOT_PASSWORD:?CAPTURE_DB_ROOT_PASSWORD must be set}
    volumes:
      - ./ideliumdb/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --silent --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 24
    networks: [capture]

  api:
    build:
      context: .
      dockerfile: docker/capture/Dockerfile
    environment:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${CAPTURE_DB_NAME:-idelium_capture}
      DB_USERNAME: ${CAPTURE_DB_USER:-idelium_capture}
      DB_PASSWORD: ${CAPTURE_DB_PASSWORD:?CAPTURE_DB_PASSWORD must be set}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "false"
      SESSION_DOMAIN: localhost
      IDELIUM_CAPTURE_MODE: "true"
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]
    volumes:
      - ./vendor:/var/www/html/vendor:ro
    ports:
      - "${CAPTURE_API_PORT:-18082}:8080"
    networks: [capture]

networks:
  capture:
    name: idelium-laravel-capture
